  o.fillStyle="#000"; o.fillRect(0,0,BW,BH);
  o.save(); o.translate(margin*k,margin*k); o.scale(s*k,s*k);
  o.fillStyle="#fff"; o.fill(silPath); o.restore();
  var md=o.getImageData(0,0,BW,BH).data;
  var N=BW*BH, inside=new Uint8Array(N);
  for(var i=0,p=0;i<N;i++,p+=4) inside[i]=md[p]>127?1:0;

  /* карта расстояний (Felzenszwalb) */
  function edt1d(f,n,d,v,z){
    var q,kk=0,sv; v[0]=0; z[0]=-1e20; z[1]=1e20;
    for(q=1;q<n;q++){
      sv=((f[q]+q*q)-(f[v[kk]]+v[kk]*v[kk]))/(2*q-2*v[kk]);
      while(sv<=z[kk]){kk--; sv=((f[q]+q*q)-(f[v[kk]]+v[kk]*v[kk]))/(2*q-2*v[kk]);}
      kk++; v[kk]=q; z[kk]=sv; z[kk+1]=1e20;
    }
    kk=0;
    for(q=0;q<n;q++){ while(z[kk+1]<q) kk++; var dx=q-v[kk]; d[q]=dx*dx+f[v[kk]]; }
  }
  var g=new Float64Array(N);
  for(i=0;i<N;i++) g[i]=inside[i]?0:1e20;
  var n1=Math.max(BW,BH);
  var tf=new Float64Array(n1), td=new Float64Array(n1), tv=new Int32Array(n1), tz=new Float64Array(n1+1);
  var x,y;
  for(x=0;x<BW;x++){ for(y=0;y<BH;y++) tf[y]=g[y*BW+x]; edt1d(tf,BH,td,tv,tz); for(y=0;y<BH;y++) g[y*BW+x]=td[y]; }
  for(y=0;y<BH;y++){ for(x=0;x<BW;x++) tf[x]=g[y*BW+x]; edt1d(tf,BW,td,tv,tz); for(x=0;x<BW;x++) g[y*BW+x]=td[x]; }
  var dist=new Float32Array(N);
  for(i=0;i<N;i++) dist[i]=Math.sqrt(g[i]);

  /* статические поля */
  var SP=SPACING_W*s*k, SPEED=SPEED_W*s*k;
  var maxD=WAVES*SP, fadeStart=maxD-SP*2.1, softStart=SP*1.45, RIMW=SP*0.5;
  function sm(e0,e1,v){ var t=Math.min(1,Math.max(0,(v-e0)/(e1-e0))); return t*t*(3-2*t); }
  var img=ctx.createImageData(BW,BH), data=img.data;
  var att=new Float32Array(N), soft=new Float32Array(N), rimA=new Float32Array(N);
  for(i=0,p=0;i<N;i++,p+=4){
    data[p+3]=0;
    if(inside[i]) continue;
    var d=dist[i]; if(d>=maxD) continue;
    att[i]=(1-sm(fadeStart,maxD,d))*Math.pow(1-(d/maxD),1.6);
    soft[i]=sm(softStart,maxD,d);
    rimA[i]= d<RIMW ? Math.pow(1-d/RIMW,1.15) : 0;
  }

  /* профиль волны и цвет */
  var LUTN=1024, lut=new Float32Array(LUTN), ramp=new Float32Array(LUTN);
  var lr8=new Uint8Array(LUTN), lg8=new Uint8Array(LUTN), lb8=new Uint8Array(LUTN);
  function mx(a,b,t){return a+(b-a)*t;}
  for(i=0;i<LUTN;i++){
    var f=i/LUTN;
    lut[i]=Math.pow(1-f,DECAY);
    var t2=Math.min(1,f/EDGEW); ramp[i]=t2*t2*(3-2*t2);
    var c0,c1,tt;
    if(f<0.5){c0=LEMON[0];c1=LEMON[1];tt=f/0.5;}else{c0=LEMON[1];c1=LEMON[2];tt=(f-0.5)/0.5;}
    lr8[i]=mx(c0[0],c1[0],tt)|0; lg8[i]=mx(c0[1],c1[1],tt)|0; lb8[i]=mx(c0[2],c1[2],tt)|0;
  }
  var invSp=1/SP, phase=0, last=0;
  built=true;

  var visChk=0, visOK=true;
  function frame(ts){
    raf=requestAnimationFrame(frame);
    if((visChk++%30)===0){
      var hb=host.getBoundingClientRect();
      visOK = hb.bottom>-40 && hb.top<(window.innerHeight+40);
    }
    if(!visOK){ last=ts; return; }
    if(!last) last=ts;
    var dt=Math.min(50, ts-last); last=ts;
    phase+=SPEED*dt/16.7;
    var pulse=0.85+0.15*Math.sin(phase*0.03/(s*k*2));
    for(var i2=0,p2=0;i2<N;i2++,p2+=4){
      var a=att[i2], rv=rimA[i2];
      if(a===0&&rv===0){ data[p2+3]=0; continue; }
      var xx=(dist[i2]-phase)*invSp;
      xx=xx-Math.floor(xx);
      var li=(xx*LUTN)|0;
      var v=lut[li]*(1-soft[i2]*(1-ramp[li]))*a*pulse;
      if(rv>v) v=rv;
      if(rv>=v-0.001&&rv>0.03){ data[p2]=lr8[0]; data[p2+1]=lg8[0]; data[p2+2]=lb8[0]; }
      else { data[p2]=lr8[li]; data[p2+1]=lg8[li]; data[p2+2]=lb8[li]; }
      data[p2+3]=v>1?255:(v*255)|0;
    }
    ctx.putImageData(img,0,0);
  }
  raf=requestAnimationFrame(frame);
}

/* авто-пересборка при любых изменениях размера */
var pend=0;
function schedule(){ clearTimeout(pend); pend=setTimeout(build,150); }
if(typeof ResizeObserver!=="undefined"){
  var ro=new ResizeObserver(schedule); ro.observe(host);
  var lg=findLogo(); if(lg&&lg!==host) ro.observe(lg);
}
window.addEventListener("resize",schedule);
window.addEventListener("orientationchange",schedule);

var lgEl=findLogo();
if(lgEl&&lgEl.tagName==="IMG"&&!lgEl.complete) lgEl.addEventListener("load",schedule);
build();
})();
</script></div></body></html>
